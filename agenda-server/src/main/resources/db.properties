# ---------------------------------------------------------------------------
# Configuracion de la conexion a la base de datos del servidor de la agenda.
#
# El servidor busca este archivo en este orden:
#   1. La ruta indicada en la propiedad del sistema -Dagenda.db.config=<ruta>
#   2. Un archivo db.properties en el directorio de trabajo actual
#   3. Este archivo, empaquetado dentro del jar (valores por defecto)
# ---------------------------------------------------------------------------

# --- SQLite (no requiere instalar ningun servidor) ---------------------------
# La ruta es relativa al directorio desde donde se arranca el servidor.
sqlite.archivo=db/agenda.db
sqlite.url=jdbc:sqlite:db/agenda.db

# --- Ajustes de concurrencia ----------------------------------------------
# Milisegundos que una operacion espera si la base de datos esta ocupada por
# otra escritura antes de reportar error (busy_timeout de SQLite).
db.busy.timeout.ms=5000
